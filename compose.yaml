name: caoguoooo-workbench
services:
  app:
    container_name: caoguoooo-workbench
    image: caoguoooo-workbench:0.3.1
    build: .
    platform: linux/amd64
    init: true
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      WORKBENCH_STORAGE: sqlite
      WORKBENCH_ALLOW_EMPTY_PASSWORD: 'false'
      WORKBENCH_DATA_DIR: /data
      WORKBENCH_REFERENCES_DIR: /data/assets/references
      WORKBENCH_IMAGE_PROXY: ''
      WORKBENCH_BACKUP_DIR: /backups
      WORKBENCH_TRUST_PROXY: 'false'
      WORKBENCH_HOME_VISUAL: 'true'
    ports:
      - '127.0.0.1:8899:3000'
    volumes:
      - ./runtime/data:/data
      - ./runtime/backups:/backups
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    pids_limit: 128
    stop_grace_period: 15s
