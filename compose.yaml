name: research-workbench
services:
  app:
    container_name: research-workbench
    image: research-workbench:demo-0.1.0
    build: .
    platform: ${CYJ_PLATFORM:-linux/amd64}
    init: true
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      CYJ_STORAGE: sqlite
      CYJ_ALLOW_EMPTY_PASSWORD: 'false'
      CYJ_DATA_DIR: /data
      CYJ_BACKUP_DIR: /backups
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?请在 .env 中填写 HTTPS 域名}
      CYJ_TRUST_PROXY: ${CYJ_TRUST_PROXY:-false}
    ports:
      - '127.0.0.1:${CYJ_HTTP_PORT:-3000}:3000'
    volumes:
      - ${CYJ_DATA_PATH:-./runtime/data}:/data
      - ${CYJ_BACKUP_PATH:-./runtime/backups}:/backups
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    pids_limit: 128
    stop_grace_period: 15s
  init-data:
    image: research-workbench:demo-0.1.0
    platform: ${CYJ_PLATFORM:-linux/amd64}
    profiles: [tools]
    user: '0:0'
    command: [node, scripts/prepare-data.mjs]
    environment:
      CYJ_DATA_DIR: /data
      CYJ_BACKUP_DIR: /backups
      CYJ_SEED_DIR: /seed
    volumes:
      - ${CYJ_DATA_PATH:-./runtime/data}:/data
      - ${CYJ_BACKUP_PATH:-./runtime/backups}:/backups
      - ./demo-data:/seed:ro
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER, DAC_OVERRIDE]
    security_opt: [no-new-privileges:true]
