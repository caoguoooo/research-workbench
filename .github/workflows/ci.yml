name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      ref:
        required: false
        type: string
      skip_container:
        required: false
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      NODE_ENV: test
      HOST: 127.0.0.1
      PUBLIC_ORIGIN: ''
      WORKBENCH_STORAGE: json
      WORKBENCH_HOME_VISUAL: 'false'
      WORKBENCH_TRUST_PROXY: 'false'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: sh -n workbench.sh
      - run: npm run package:release
  container:
    needs: test
    if: ${{ !inputs.skip_container }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Build and verify container upgrade/rollback
        run: |
          VERSION=$(node -p "require('./package.json').version")
          docker build --platform linux/amd64 -t "caoguoooo-workbench:$VERSION" .
          node scripts/docker-smoke.mjs "caoguoooo-workbench:$VERSION"
